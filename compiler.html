<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE - ProcessLang</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0f0f0f;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-dim: #888;

            /* Цвета команд */
            --c-flow: #00d4ff;
            --c-dissolve: #c77dff;
            --c-connect: #06ffa5;
            --c-observe: #e0f2fe;
            --c-choose: #ff6b35;
            --c-encode: #ffd93d;
            --c-cycle: #9d4edd;
            --c-logic: #7dd3fc;
            --c-runtime: #60a5fa;
            --c-manifest: #fb923c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAV --- */
        nav {
            height: 60px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: rgba(5,5,5,0.95); z-index: 10;
        }
        .logo { font-weight: 800; color: #fff; text-decoration: none; font-size: 1.2rem; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; margin-left: 20px; transition: 0.3s; }
        .nav-link:hover { color: #fff; }

        /* --- TOOLBAR --- */
        .toolbar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }

        .cmd-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-family: 'Courier Prime', monospace;
            font-weight: 700; font-size: 0.85rem;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .cmd-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* Цвета кнопок */
        .btn-flow { color: var(--c-flow); border-color: rgba(0, 212, 255, 0.3); }
        .btn-dissolve { color: var(--c-dissolve); border-color: rgba(199, 125, 255, 0.3); }
        .btn-connect { color: var(--c-connect); border-color: rgba(6, 255, 165, 0.3); }
        .btn-observe { color: var(--c-observe); border-color: rgba(224, 242, 254, 0.3); }
        .btn-choose { color: var(--c-choose); border-color: rgba(255, 107, 53, 0.3); }
        .btn-encode { color: var(--c-encode); border-color: rgba(255, 217, 61, 0.3); }
        .btn-cycle { color: var(--c-cycle); border-color: rgba(157, 78, 221, 0.3); }
        .btn-logic { color: var(--c-logic); border-color: rgba(125, 211, 252, 0.3); }
        .btn-runtime { color: var(--c-runtime); border-color: rgba(96, 165, 250, 0.3); }
        .btn-manifest { color: var(--c-manifest); border-color: rgba(251, 146, 60, 0.3); }

        /* --- WORKSPACE --- */
        .workspace-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        .editor-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }

        .canvas {
            flex: 1; padding: 30px; overflow-y: auto;
            font-family: 'Courier Prime', monospace; font-size: 1rem;
            display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 150px;
        }

        .empty-state { color: #333; text-align: center; margin-top: 50px; font-family: 'Inter', sans-serif; font-size: 0.9rem; }

        .smart-line {
            display: flex; align-items: center; flex-wrap: wrap;
            padding: 12px 15px; background: rgba(20, 20, 20, 0.8);
            border: 1px solid #222; border-left: 3px solid transparent;
            border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .smart-line:hover { background: #1a1a1a; }
        .smart-line .cmd-name { font-weight: 700; margin-right: 10px; }
        .smart-line .params { color: #888; font-size: 0.9em; word-break: break-all; }
        .smart-line .delete-btn { margin-left: auto; color: #444; padding: 5px; opacity: 0; transition: 0.2s; }
        .smart-line:hover .delete-btn { opacity: 1; }
        .smart-line .delete-btn:hover { color: #ff5555; }

        /* --- QUERY --- */
        .query-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg); border-top: 1px solid var(--border-color);
            padding: 20px; z-index: 5;
        }
        .query-label { color: var(--c-manifest); font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; display: block; }
        .query-input {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 12px; border-radius: 6px; font-family: 'Inter', sans-serif;
            resize: none; height: 60px;
        }

        /* --- OUTPUT --- */
        .output-panel {
            width: 350px; background: #080808; border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .output-header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .btn-compile { background: var(--text-main); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; cursor: pointer; }
        .btn-compile:hover { background: #fff; }
        .output-content { flex: 1; padding: 20px; font-family: 'Courier Prime', monospace; font-size: 0.85rem; color: #aaa; white-space: pre-wrap; overflow-y: auto; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #111; border: 1px solid #333; width: 90%; max-width: 500px;
            border-radius: 12px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-family: 'Courier Prime', monospace; font-size: 1.5rem; font-weight: 700; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: #888; font-size: 0.85rem; margin-bottom: 8px; }

        /* Слайдеры */
        input[type="range"] { width: 100%; accent-color: var(--text-main); }
        .range-val { float: right; color: #fff; font-family: monospace; }

        /* Input Text */
        .input-text { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; }

        /* Теги (Исправленные) */
        .tags-container {
            border: 1px solid #333; background: #000; padding: 8px; border-radius: 6px;
            display: flex; flex-wrap: wrap; gap: 8px; min-height: 45px; cursor: text;
        }
        .tag-chip {
            background: #222; color: #fff; padding: 4px 10px; border-radius: 20px;
            font-size: 0.9rem; display: flex; align-items: center; gap: 6px; border: 1px solid #444;
        }
        .tag-chip i { cursor: pointer; color: #888; font-size: 0.8rem; }
        .tag-chip i:hover { color: #ff5555; }

        .tags-input-field {
            background: transparent; border: none; color: #fff; flex: 1;
            min-width: 120px; padding: 4px; font-size: 0.95rem;
        }

        /* Радио */
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .radio-btn {
            border: 1px solid #333; padding: 8px 14px; border-radius: 4px;
            cursor: pointer; font-size: 0.9rem; color: #888; transition: 0.2s; background: #050505;
        }
        .radio-btn:hover { border-color: #555; }
        .radio-btn.active { border-color: #fff; color: #fff; background: #222; }

        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn-cancel { background: transparent; color: #666; border: none; cursor: pointer; }
        .btn-save { background: #fff; color: #000; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        @media (max-width: 800px) {
            .workspace-container { flex-direction: column; }
            .output-panel { height: 200px; width: 100%; border-left: none; border-top: 1px solid #222; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ProcessLang IDE</a>
        <a href="index.html" class="nav-link">Выход</a>
    </nav>

    <div class="toolbar">
        <button class="cmd-btn btn-flow" onclick="openModal('FLOW')"><i class="ph ph-waves"></i> FLOW</button>
        <button class="cmd-btn btn-dissolve" onclick="openModal('DISSOLVE')"><i class="ph ph-drop"></i> DISSOLVE</button>
        <button class="cmd-btn btn-connect" onclick="openModal('CONNECT')"><i class="ph ph-link"></i> CONNECT</button>
        <button class="cmd-btn btn-observe" onclick="openModal('OBSERVE')"><i class="ph ph-eye"></i> OBSERVE</button>
        <button class="cmd-btn btn-choose" onclick="openModal('CHOOSE')"><i class="ph ph-lightning"></i> CHOOSE</button>
        <button class="cmd-btn btn-encode" onclick="openModal('ENCODE')"><i class="ph ph-diamond"></i> ENCODE</button>
        <button class="cmd-btn btn-cycle" onclick="openModal('CYCLE')"><i class="ph ph-arrows-clockwise"></i> CYCLE</button>
        <button class="cmd-btn btn-logic" onclick="openModal('LOGIC')"><i class="ph ph-triangle"></i> LOGIC</button>
        <button class="cmd-btn btn-runtime" onclick="openModal('RUNTIME')"><i class="ph ph-square"></i> RUNTIME</button>
        <button class="cmd-btn btn-manifest" onclick="openModal('MANIFEST')"><i class="ph ph-cube"></i> MANIFEST</button>
    </div>

    <div class="workspace-container">
        <div class="editor-area">
            <div id="canvas" class="canvas">
                <div class="empty-state">Добавьте команды из меню сверху...</div>
            </div>
            <div class="query-panel">
                <span class="query-label">QUERY</span>
                <textarea id="queryInput" class="query-input" placeholder="Введите ваш запрос к системе..."></textarea>
            </div>
        </div>
        <div class="output-panel">
            <div class="output-header">
                <span style="color:#666; font-weight:bold;">OUTPUT</span>
                <button class="btn-compile" onclick="compile()">COMPILE</button>
            </div>
            <div id="output" class="output-content">Результат компиляции появится здесь...</div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div id="modalTitle" class="modal-title">COMMAND</div>
            </div>
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="saveCommand()">OK</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const COMMANDS = {
            'FLOW': { color: '#00d4ff', params: [{name: 'engagement', type: 'slider', def: 0.7}, {name: 'resistance', type: 'slider', def: 0.3}] },
            'DISSOLVE': { color: '#c77dff', params: [{name: 'rigidity', type: 'slider', def: 0.7}, {name: 'target', type: 'text', def: ''}] },
            'CONNECT': { color: '#06ffa5', params: [{name: 'depth', type: 'slider', def: 0.8}, {name: 'between', type: 'tags', def: []}] },
            'OBSERVE': { color: '#e0f2fe', params: [{name: 'distance', type: 'slider', def: 0.5}, {name: 'target', type: 'text', def: ''}] },
            'CHOOSE': { color: '#ff6b35', params: [{name: 'space', type: 'tags', def: []}, {name: 'method', type: 'select', opts:['conscious','unconscious','forced', 'random'], def:'conscious'}] },
            'ENCODE': { color: '#ffd93d', params: [{name: 'type', type: 'select', opts:['network','hierarchy','narrative','sequence','category','spatial'], def:'network'}, {name: 'loss', type: 'slider', def: 0.3}] },
            'CYCLE': { color: '#9d4edd', params: [{name: 'mode', type: 'select', opts:['stable','intense','degrading'], def:'stable'}, {name: 'intensity', type: 'slider', def: 0.7}] },
            'LOGIC': { color: '#7dd3fc', params: [{name: 'rule', type: 'text', def:''}, {name: 'mode', type: 'select', opts:['eternal','limited'], def:'eternal'}] },
            'RUNTIME': { color: '#60a5fa', params: [{name: 'pattern', type: 'text', def:''}, {name: 'repetitions', type: 'number', def:20}] },
            'MANIFEST': { color: '#fb923c', params: [{name: 'format', type: 'select', opts:['detailed','minimal','flowing', 'structured', 'technical', 'conversational'], def:'detailed'}, {name: 'loss', type: 'slider', def: 0.2}] }
        };

        let workspaceData = [];
        let editingId = null;

        // --- RENDER MODAL ---
        function openModal(type, id = null) {
            editingId = id;
            const config = COMMANDS[type];
            const data = id !== null ? workspaceData.find(x => x.id === id).params : null;

            document.getElementById('modalTitle').style.color = config.color;
            document.getElementById('modalTitle').innerText = type;
            document.getElementById('modal').classList.add('active');

            let html = '';
            config.params.forEach(p => {
                const val = data ? data[p.name] : p.def;
                html += `<div class="form-group"><label class="form-label">${p.name.toUpperCase()}</label>`;

                if (p.type === 'slider') {
                    html += `<input type="range" min="0" max="1" step="0.05" value="${val}" id="inp_${p.name}" oninput="this.nextElementSibling.innerText=this.value">
                             <span class="range-val">${val}</span>`;
                } else if (p.type === 'text') {
                    html += `<input type="text" value="${val}" id="inp_${p.name}" class="input-text">`;
                } else if (p.type === 'number') {
                    html += `<input type="number" value="${val}" id="inp_${p.name}" class="input-text">`;
                } else if (p.type === 'select') {
                    html += `<div class="radio-group">`;
                    p.opts.forEach(opt => {
                        const active = opt === val ? 'active' : '';
                        html += `<div class="radio-btn ${active}" onclick="selectRadio(this, '${p.name}')" data-val="${opt}">${opt}</div>`;
                    });
                    html += `<input type="hidden" id="inp_${p.name}" value="${val}"></div>`;
                } else if (p.type === 'tags') {
                    // NEW TAG SYSTEM
                    html += `<div class="tags-container" onclick="document.getElementById('input_${p.name}').focus()">`;
                    html += `<div id="chips_${p.name}" style="display:contents">`;
                    (Array.isArray(val) ? val : []).forEach(t => {
                        html += createTagHtml(t);
                    });
                    html += `</div>`;
                    html += `<input id="input_${p.name}" class="tags-input-field" onkeydown="handleTag(event, this, 'chips_${p.name}')"></div>`;
                }
                html += `</div>`;
            });

            document.getElementById('modal').dataset.type = type;
            document.getElementById('modalBody').innerHTML = html;
        }

        // --- TAG SYSTEM HELPERS ---
        function createTagHtml(text) {
            return `<div class="tag-chip"><span class="tag-text">${text}</span><i class="ph ph-x" onclick="this.parentElement.remove()"></i></div>`;
        }

        function handleTag(e, input, containerId) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = input.value.trim();
                if (val) {
                    const container = document.getElementById(containerId);
                    // Append HTML safely
                    const temp = document.createElement('div');
                    temp.innerHTML = createTagHtml(val);
                    container.appendChild(temp.firstChild);
                    input.value = '';
                }
            }
        }

        function selectRadio(el, name) {
            el.parentElement.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`inp_${name}`).value = el.dataset.val;
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingId = null;
        }

        function saveCommand() {
            const type = document.getElementById('modal').dataset.type;
            const config = COMMANDS[type];
            const params = {};

            config.params.forEach(p => {
                if (p.type === 'tags') {
                    const tags = [];
                    // Collect tags from chips
                    document.querySelectorAll(`#chips_${p.name} .tag-text`).forEach(el => tags.push(el.innerText));
                    params[p.name] = tags;
                } else {
                    params[p.name] = document.getElementById(`inp_${p.name}`).value;
                }
            });

            if (editingId !== null) {
                const idx = workspaceData.findIndex(x => x.id === editingId);
                workspaceData[idx].params = params;
            } else {
                workspaceData.push({ id: Date.now(), type, params });
            }

            renderWorkspace();
            closeModal();
        }

        function renderWorkspace() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            if (workspaceData.length === 0) {
                canvas.innerHTML = '<div class="empty-state">Добавьте команды из меню сверху...</div>';
                return;
            }

            workspaceData.forEach(block => {
                const config = COMMANDS[block.type];
                let paramStr = '';
                for (const [key, val] of Object.entries(block.params)) {
                    let displayVal = val;
                    if (Array.isArray(val)) displayVal = `[${val.map(v=>`"${v}"`).join(', ')}]`;
                    paramStr += `<span style="color:#666; margin-left:10px;">${key}=</span><span style="color:#bbb;">${displayVal}</span>`;
                }

                const div = document.createElement('div');
                div.className = 'smart-line';
                div.style.borderLeftColor = config.color;
                div.innerHTML = `
                    <span class="cmd-name" style="color:${config.color}">${block.type}</span>
                    <span class="params">${paramStr}</span>
                    <i class="ph ph-trash delete-btn" onclick="event.stopPropagation(); deleteBlock(${block.id})"></i>
                `;
                div.onclick = () => openModal(block.type, block.id);
                canvas.appendChild(div);
            });
        }

        function deleteBlock(id) {
            workspaceData = workspaceData.filter(x => x.id !== id);
            renderWorkspace();
        }

        function compile() {
            let output = "";
            const uniqueTypes = [...new Set(workspaceData.map(x => x.type))];
            uniqueTypes.forEach(t => { output += `LOADING MODULE: ${t}...\n`; });
            output += `================================\n\n`;

            workspaceData.forEach(block => {
                let line = `${block.type}`;
                for (const [key, val] of Object.entries(block.params)) {
                    let v = val;
                    if (Array.isArray(val)) v = `[${val.map(s => `"${s}"`).join(', ')}]`;
                    else if (isNaN(val) && block.params[key].length > 0) v = `"${val}"`;
                    else v = val;
                    line += ` ${key}=${v}`;
                }
                output += line + "\n";
            });

            const q = document.getElementById('queryInput').value;
            output += `\nQUERY: ${q}`;

            document.getElementById('output').innerText = output;
        }
    </script>
</body>
</html>
