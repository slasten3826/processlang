<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE - ProcessLang</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        nav { background: #0f0f0f; padding: 1rem 2rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #00f2ff; font-weight: bold; text-decoration: none; font-size: 1.2rem; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; }
        .main-workspace { display: flex; flex: 1; overflow: hidden; }
        .command-library { width: 250px; background: #111; padding: 1rem; border-right: 1px solid #333; overflow-y: auto; }
        .constructor { flex: 1; display: flex; flex-direction: column; background: #050505; }
        .output-panel { width: 350px; background: #0e0e0e; border-left: 1px solid #333; padding: 1rem; font-family: monospace; }
        .command-item { background: #222; border: 1px solid #444; padding: 10px; margin-bottom: 10px; cursor: grab; border-radius: 5px; }
        .command-block { background: #1a1a1a; border: 1px solid #00f2ff; padding: 15px; margin: 10px; border-radius: 8px; position: relative; }
        .btn { padding: 8px 16px; background: #00f2ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .constructor-workspace { flex: 1; padding: 20px; overflow-y: auto; }
        .cmd-flow { border-color: #00d4ff; color: #00d4ff; }
        .cmd-dissolve { border-color: #c77dff; color: #c77dff; }
        /* Add other colors as needed */
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ProcessLang IDE</a>
        <div class="nav-links"><a href="index.html">Назад</a></div>
    </nav>
    <div class="main-workspace">
        <div class="command-library">
            <h3>Команды</h3>
            <div class="command-item cmd-flow" draggable="true" ondragstart="event.dataTransfer.setData('type', 'FLOW')">FLOW</div>
            <div class="command-item cmd-dissolve" draggable="true" ondragstart="event.dataTransfer.setData('type', 'DISSOLVE')">DISSOLVE</div>
            <div class="command-item" draggable="true" ondragstart="event.dataTransfer.setData('type', 'CONNECT')">CONNECT</div>
            <div class="command-item" draggable="true" ondragstart="event.dataTransfer.setData('type', 'OBSERVE')">OBSERVE</div>
            </div>
        <div class="constructor">
            <div style="padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: flex-end;">
                <button class="btn" onclick="compile()">Скомпилировать</button>
            </div>
            <div class="constructor-workspace" id="workspace" ondragover="event.preventDefault()" ondrop="drop(event)">
                <div style="color: #444; text-align: center; margin-top: 20%;">Перетащите блоки сюда</div>
            </div>
        </div>
        <div class="output-panel" id="output">Ожидание компиляции...</div>
    </div>
    <script>
        function drop(ev) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            const div = document.createElement("div");
            div.className = "command-block cmd-" + type.toLowerCase();
            div.innerHTML = `<strong>${type}</strong><br><input type="text" placeholder="Параметры..." style="background:#000; border:1px solid #333; color:#fff; width:100%; margin-top:5px;">`;
            document.getElementById("workspace").appendChild(div);
            // Remove placeholder if exists
            const ph = document.querySelector(".constructor-workspace > div");
            if(ph && ph.innerText.includes("Перетащите")) ph.remove();
        }
        function compile() {
            document.getElementById("output").innerText = "Компиляция...\nГотово.";
        }
    </script>
</body>
</html>
