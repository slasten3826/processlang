<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcessLang</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <nav>
        <a href="#home" class="logo" onclick="route(event)">ProcessLang</a>

        <button class="hamburger" onclick="toggleMenu()">
            <i class="ph ph-list"></i>
        </button>

        <div class="nav-links" id="navMenu">
            <a href="#feed" onclick="route(event)" data-i18n="nav_feed">Лента</a>
            <a href="#compiler" onclick="route(event)" data-i18n="nav_create">Создать</a>

            <div id="auth-container"></div>

            <button class="btn-login lang-switch" onclick="toggleLanguage()" style="min-width: 40px; justify-content: center;">
                RU
            </button>
        </div>
    </nav>

    <main id="app-view">
        <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-dim);">
            <i class="ph ph-spinner" style="font-size: 2rem; animation: spin 1s linear infinite;"></i>
            <p style="margin-top: 1rem;" data-i18n="loading">Loading the Void...</p>
        </div>
    </main>

    <script src="src/scripts/config.js"></script>
    <script src="src/scripts/i18n.js"></script>
    <script src="src/scripts/visuals.js"></script>
    <script src="src/scripts/app.js"></script>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
