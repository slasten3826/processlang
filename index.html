<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcessLang</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">
                    <div class="glitch-pl">PL</div>
                </div>
                </div>

            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="ph ph-list"></i>
            </div>

            <ul class="nav-menu" id="navMenu">
                <li><a href="#home" data-i18n="nav_home" onclick="toggleMenu()">Главная</a></li>
                <li><a href="#syntax" data-i18n="nav_syntax" onclick="toggleMenu()">Синтаксис</a></li>
                <li><a href="#philosophy" data-i18n="nav_philosophy" onclick="toggleMenu()">Философия</a></li>

                <li>
                    <a href="compiler.html" style="color: var(--accent-cyan); font-weight: bold; text-shadow: 0 0 10px rgba(100,200,255,0.3);">
                        IDE
                    </a>
                </li>
            </ul>

            <div class="auth-section" id="auth-container">
                </div>

            <div class="lang-switch" onclick="toggleLanguage()">RU</div>
        </div>
    </nav>

    <main id="app-view">
        <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-dim);">
            <i class="ph ph-spinner" style="font-size: 2rem; animation: spin 1s linear infinite;"></i>
            <p style="margin-top: 1rem;" data-i18n="loading">Loading the Void...</p>
        </div>
    </main>

    <script src="src/scripts/config.js"></script>
    <script src="src/scripts/i18n.js"></script>
    <script src="src/scripts/visuals.js"></script>
    <script src="src/scripts/app.js"></script>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
